<template>
    <div class="slds-m-bottom_medium">
        <h3 class="slds-text-heading_small slds-m-bottom_medium">4. INFORMACIÓN ACCIONISTAS</h3>

        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
            <p class="slds-text-title_bold">INSTRUCCIONES DE DILIGENCIAMIENTO:</p>
            <ul class="slds-list_dotted">
                <li>Relacione accionistas con más del **5% del Capital Social**.</li>
                <li>Si la persona jurídica no cotiza en bolsa, relacione la composición en la **Sección 5**.</li>
                <li>Si el accionista es **PEP**, diligencie la sección correspondiente.</li>
            </ul>
        </div>


        <lightning-card title="Gestión de Registros" icon-name="standard:contact">
            <div slot="actions">
                <lightning-button label="Nuevo Registro" onclick={openModal} variant="brand"></lightning-button>
            </div>

            <div class="slds-p-around_medium">
                <template if:true={hasRecords}>
                    <div>
                        <lightning-datatable key-field="Id" data={data} columns={columns} hide-checkbox-column show-row-number-column>
                        </lightning-datatable>
                    </div>
                </template>

                <template if:false={hasRecords}>
                    <div class="slds-text-align_center slds-p-vertical_large">
                        <p>No se encontraron registros para mostrar.</p>
                    </div>
                </template>
            </div>
        </lightning-card>

        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Cerrar" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Crear Nuevo Registro</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form object-api-name="Participante_de_Poliza__c" onsuccess={handleSuccess}>

                            <lightning-messages></lightning-messages>

                            <lightning-input-field field-name="Caso_Relacionado__c" value={recordId} class="slds-hide"></lightning-input-field>

                            <lightning-input-field field-name="Nombre_del_Cliente__c" required></lightning-input-field>
                            <lightning-input-field field-name="Tipo_de_Documento__c" required></lightning-input-field>
                            <lightning-input-field field-name="Cedula_o_NIT__c"></lightning-input-field>
                            <lightning-input-field field-name="de_Participacion__c"></lightning-input-field>
                            <lightning-input-field field-name="Cotiza_en_bolsa__c"></lightning-input-field>
                            <lightning-input-field field-name="Es_PEP__c"></lightning-input-field>
                            <lightning-input-field field-name="Tributa_en_otro_pais__c"></lightning-input-field>

                            <div class="slds-m-top_medium slds-text-align_right">
                                <lightning-button label="Cancelar" onclick={closeModal}
                                    class="slds-m-right_small"></lightning-button>
                                <lightning-button type="submit" variant="brand" label="Guardar"></lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <div class="slds-m-top_medium">
            <lightning-button label="Agregar Accionista" icon-name="utility:add"
                onclick={addShareholder}></lightning-button>
        </div>

        <div class="slds-grid slds-grid_align-center slds-p-top_large">
            <lightning-button label="Atrás" onclick={handlePrevious} class="slds-m-right_x-small"></lightning-button>
            <lightning-button label="Siguiente" variant="brand" onclick={handleNext}
                class="slds-m-left_x-small"></lightning-button>
        </div>
    </div>
</template>
