<template>
    <div class="slds-m-bottom_medium">
        <h3 class="slds-text-heading_small slds-m-bottom_medium">4. INFORMACIÓN ACCIONISTAS</h3>

        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
            <p class="slds-text-title_bold">INSTRUCCIONES DE DILIGENCIAMIENTO:</p>
            <ul class="slds-list_dotted">
                <li>Relacione accionistas con más del **5% del Capital Social**.</li>
                <li>Si la persona jurídica no cotiza en bolsa, relacione la composición en la **Sección 5**.</li>
                <li>Si el accionista es **PEP**, diligencie la sección correspondiente.</li>
            </ul>
        </div>

        <template if:true={statusMessage.visible}>
            <div class="slds-m-bottom_small">
                <div class={statusMessage.variant} role="status">
                    <div class="slds-scoped-notification slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:info" variant="inverse" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>{statusMessage.text}</p>
                        </div>
                        <div class="slds-media__figure">
                            <button class="slds-button slds-button_icon slds-button_icon-inverse" title="Cerrar"
                                onclick={hideStatus}>
                                <lightning-icon icon-name="utility:close" size="xx-small"
                                    variant="inverse"></lightning-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <lightning-card title="Listado de accionistas" icon-name="custom:custom15">
            <div slot="actions">
                <lightning-button label="Agregar Accionista" icon-name="utility:add" onclick={openModal}
                    variant="brand"></lightning-button>
            </div>

            <div class="slds-p-around_medium">
                <template if:true={hasRecords}>
                    <div>
                        <lightning-datatable key-field="Id" data={shareholders} columns={columns} hide-checkbox-column
                            show-row-number-column>
                        </lightning-datatable>
                    </div>
                </template>

                <template if:false={hasRecords}>
                    <div class="slds-text-align_center slds-p-vertical_large slds-box slds-theme_alert-texture">
                        <h3 class="slds-text-heading_medium">Sin accionistas</h3>
                        <p>Haz clic en "Agregar Accionista" para empezar.</p>
                    </div>
                </template>
            </div>
        </lightning-card>

        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Cerrar" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Crear Nuevo Registro</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium slds-is-relative">
                        <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Guardando..." size="medium" variant="brand">
                            </lightning-spinner>
                        </template>
                        <lightning-record-edit-form object-api-name="Participante_de_Poliza__c"
                            onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError}>
                            <lightning-messages></lightning-messages>

                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-1 slds-p-horizontal_x-small">
                                    <lightning-input-field field-name="Nombre_del_Cliente__c" required></lightning-input-field>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small">
                                    <lightning-input-field field-name="Tipo_de_Documento__c" required></lightning-input-field>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small">
                                    <lightning-input-field field-name="Cedula_o_NIT__c"
                                        required></lightning-input-field>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small">
                                    <lightning-input-field field-name="de_Participacion__c"
                                        required></lightning-input-field>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small">
                                    <lightning-input-field field-name="Cotiza_en_bolsa__c"
                                        required></lightning-input-field>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small">
                                    <lightning-input-field field-name="Es_PEP__c" required></lightning-input-field>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small">
                                    <lightning-input-field field-name="Tributa_en_otro_pais__c"
                                        required></lightning-input-field>
                                </div>
                            </div>

                            <div class="slds-m-top_medium slds-text-align_center">
                                <lightning-button label="Cancelar" onclick={closeModal}
                                    class="slds-m-right_small"></lightning-button>
                                <lightning-button type="submit" variant="brand" label="Guardar"></lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <div class="slds-grid slds-grid_align-center slds-p-top_large">
            <lightning-button label="Atrás" onclick={handlePrevious} class="slds-m-right_x-small"></lightning-button>
            <lightning-button label="Siguiente" variant="brand" onclick={handleNext}
                class="slds-m-left_x-small"></lightning-button>
        </div>
    </div>
</template>
